<!doctype html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E9">
  <title>ფასდაკლებები — თბილისი LIVE</title>
  <meta name="description" content="თბილისის ბიზნესების მიმდინარე აქციები და ფასდაკლებები ერთ გვერდზე.">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('tl.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#14110E';
    } catch (e) {}
  </script>
</head>

<body class="page">
  <header id="hdr"></header>

  <main class="wrap" style="padding-block: var(--sp-5) var(--sp-8)">
    <header style="margin-bottom:var(--sp-5)">
      <p class="eyebrow">მიმდინარე შეთავაზებები</p>
      <h1 style="font-size:var(--fs-xl)">ფასდაკლებები</h1>
    </header>
    <div id="results"></div>
  </main>

  <footer id="ftr"></footer>
  <script type="module" src="/src/pages/promos.js"></script>
</body>
</html>
