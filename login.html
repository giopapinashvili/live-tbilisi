<!doctype html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>შესვლა — თბილისი LIVE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('tl.theme') || 'light'; } catch (e) {}
  </script>
</head>
<body class="page">
  <header id="hdr"></header>
  <main class="wrap" style="display:grid; place-items:center; min-height:70dvh">
    <div class="card" style="width:min(400px,100%)">
      <div class="card-body" style="display:grid; gap:var(--sp-4); text-align:center">
        <div>
          <h1 style="font-size:var(--fs-lg); margin-bottom:var(--sp-2)">შესვლა</h1>
          <p class="muted" style="font-size:var(--fs-sm); margin:0">
            ბიზნესის პროფილის სამართავად ან შეფასების დასატოვებლად.
          </p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="button" id="google">Google-ით შესვლა</button>
        <p class="dim" style="font-size:var(--fs-xs); margin:0" id="note"></p>
      </div>
    </div>
  </main>
  <footer id="ftr"></footer>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
