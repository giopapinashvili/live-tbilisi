<!doctype html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E9">
  <title>ძებნა — თბილისი LIVE</title>
  <meta name="description" content="მოძებნე ბიზნესი, სერვისი ან პროდუქტი თბილისში.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('tl.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#14110E';
    } catch (e) {}
  </script>
</head>

<body class="page">
  <header id="hdr"></header>

  <main class="wrap" style="padding-block: var(--sp-5) var(--sp-8); max-width: 900px">
    <h1 style="font-size:var(--fs-xl)">ძებნა</h1>
    <div id="search-host" style="margin-bottom:var(--sp-5)"></div>
    <div class="muted" id="result-count" style="margin-bottom:var(--sp-4)"></div>
    <div id="results"></div>
  </main>

  <footer id="ftr"></footer>
  <script type="module" src="/src/pages/search.js"></script>
</body>
</html>
