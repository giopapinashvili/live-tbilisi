<!doctype html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E9">

  <title>თბილისი LIVE</title>
  <meta name="description" content="რა ხდება ქალაქში ახლა — ღია ადგილები, ახალი შეთავაზებები და ფასები შენს გარშემო.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="თბილისი LIVE">
  <meta property="og:description" content="რა ხდება ქალაქში ახლა.">
  <meta property="og:locale" content="ka_GE">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    try {
      var t = localStorage.getItem('tl.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#14110E';
    } catch (e) {}
  </script>
</head>

<body>
  <main class="feed-shell">
    <div class="feed-col">
      <div class="feed-top">
        <h1 class="feed-title">თბილისი<span style="color:var(--accent)">LIVE</span></h1>
        <div id="feed-search" style="flex:1"></div>
      </div>

      <div class="stories" id="stories"></div>

      <div id="feed"></div>

      <div class="row" style="justify-content:center; padding:var(--sp-5) 0">
        <button class="btn" type="button" id="more" hidden>მეტის ჩვენება</button>
      </div>
    </div>

    <aside class="feed-aside" id="aside"></aside>
  </main>

  <nav id="tabbar"></nav>
  <script type="module" src="/src/pages/feed.js"></script>
</body>
</html>
