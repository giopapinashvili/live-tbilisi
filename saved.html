<!doctype html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E9">
  <title>შენახული — თბილისი LIVE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('tl.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#14110E';
    } catch (e) {}
  </script>
</head>
<body>
  <main class="wrap" style="max-width:760px; padding-block:var(--sp-5) var(--sp-8)">
    <h1 style="font-size:var(--fs-xl)">შენახული</h1>
    <div class="pf-tabs" role="tablist" style="margin-bottom:var(--sp-4)">
      <button class="pf-tab" type="button" data-list="saves" aria-selected="true">შენახული</button>
      <button class="pf-tab" type="button" data-list="follows" aria-selected="false">გამოწერილი</button>
    </div>
    <div id="list"></div>
  </main>
  <nav id="tabbar"></nav>
  <script type="module" src="/src/pages/saved.js"></script>
</body>
</html>
